<style>
:root{
  --bg:#FFF4EA; --line:#F6A866; --text:#3A1A14; --muted:#7A4636; --accent:#B3201E;
  --orange:#FCAE6B; --panel:#FFFFFF; --panel-line:#EBCDB8;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  font-family:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --panel:#FFFFFF; } }
:root[data-theme="dark"]{ --panel:#FFFFFF; }
*,*::before,*::after{box-sizing:inherit}
:root{--u:1vw}
/* one window per projector: each window is a whole screen, so the unit doubles */
:root.view-1,:root.view-2{--u:2vw}
.stage[data-layout="split"][data-view="1"],.stage[data-layout="split"][data-view="2"]{grid-template-columns:1fr}
.stage[data-layout="split"][data-view="1"] .screen.b,.stage[data-layout="split"][data-view="2"] .screen.a{display:none}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--text);overflow:hidden;transition:background .8s}
body.idle{cursor:none}

/* palettes — all light, since projection is onto a white screen */
body[data-palette="white"]{--bg:#FFFFFF;--line:#F8BD8C}
body[data-palette="red"]{--bg:#A11D1B;--line:#D2584C;--text:#FFFFFF;--muted:#FFD9C2;--accent:#FFFFFF;--orange:#FCAE6B;--panel:#FFFFFF;--panel-line:#EBCDB8}
body[data-palette="red"] .subtitle{color:var(--orange)}
body[data-palette="red"] .clock .sec{color:var(--orange)}
body[data-palette="red"] .meta strong{color:#FFFFFF}
body[data-palette="orange"]{--bg:#F7A967;--line:#E98A4E;--text:#13305E;--muted:#3B4F75;--accent:#9E2229;--orange:#9E2229;--panel:#FFFFFF;--panel-line:#EBCDB8}
body[data-palette="orange"] .clock .sec{color:#9E2229}
body[data-palette="orange"] .panel{color:#3A1A14}
body[data-palette="orange"] .panel input,body[data-palette="orange"] .panel textarea,body[data-palette="orange"] .panel select,body[data-palette="orange"] .panel button{background:#FFF4EA;color:#3A1A14}
body[data-palette="orange"] .panel button.primary{background:#9E2229;color:#fff;border-color:#9E2229}
body[data-palette="orange"] .gear{color:#3A1A14}
.brand .on-red{display:none}
body[data-palette="red"] .brand .on-red{display:block}
body[data-palette="red"] .brand .on-light{display:none}
body[data-palette="red"] .gear{color:#3A1A14}
body[data-palette="red"] .panel{color:#3A1A14}
body[data-palette="red"] .panel input,body[data-palette="red"] .panel textarea,body[data-palette="red"] .panel select,body[data-palette="red"] .panel button{background:#FFF4EA;color:#3A1A14}

canvas{position:fixed;inset:0;width:100%;height:100%;display:block}

.stage{position:relative;height:100%;display:grid;grid-template-columns:1fr 1fr;will-change:transform}
.stage[data-layout="single"]{grid-template-columns:1fr}
.screen{position:relative;display:flex;flex-direction:column;justify-content:space-between;padding:clamp(24px,6vh,90px) clamp(24px,calc(5*var(--u)),120px);min-width:0}
.stage[data-layout="single"] .screen.b{display:none}

.title{font-weight:700;color:var(--accent);font-size:clamp(34px,calc(7.2*var(--u)),190px);line-height:.92;letter-spacing:-.035em;margin:0;overflow-wrap:anywhere}
.stage[data-layout="mirror"] .title,.stage[data-layout="split"] .title{font-size:clamp(34px,calc(4.1*var(--u)),158px);line-height:1;letter-spacing:-.04em}
.stage[data-layout="split"] .screen.a{padding-right:clamp(16px,calc(1.5*var(--u)),48px)}
.title{white-space:pre}
.stage[data-layout="mirror"] .title{font-size:clamp(20px,calc(2*var(--u)),76px)}
.subtitle{font-weight:700;font-size:clamp(22px,calc(2.6*var(--u)),100px);color:var(--text);letter-spacing:-.02em;margin:.45em 0 0;max-width:none;line-height:1.15}
.meta{font-size:clamp(15px,calc(1.35*var(--u)),40px);color:var(--muted);line-height:1.5}
.meta strong{color:var(--text);font-weight:500;display:block}

.clock{font-weight:500;font-size:clamp(56px,calc(11*var(--u)),300px);letter-spacing:-.05em;line-height:.9;font-variant-numeric:tabular-nums;margin:0}
.clock .sec{font-size:.28em;color:var(--accent);letter-spacing:0;margin-left:.15em;vertical-align:top;position:relative;top:.35em}
.day{font-size:clamp(14px,calc(1.3*var(--u)),34px);color:var(--muted);font-weight:500;margin-top:.5em}
.msg{font-weight:500;font-size:clamp(20px,calc(2.6*var(--u)),68px);line-height:1.12;letter-spacing:-.015em;max-width:18ch;min-height:2.3em;transition:opacity .9s,transform .9s}
.msg.out{opacity:0;transform:translateY(.4em)}
.foot{font-size:clamp(14px,calc(1.15*var(--u)),30px);color:var(--muted)}
.clock .sec{color:var(--accent)}
.brand{display:flex;align-items:center;gap:clamp(16px,calc(2.5*var(--u)),60px);margin-bottom:clamp(16px,4vh,50px)}
.brand img{display:block;height:clamp(64px,13vh,190px);width:auto}
.brand img.banner{height:clamp(56px,14vh,200px);max-width:100%;object-fit:contain;object-position:left center}
.band{position:fixed;left:0;right:0;top:0;height:clamp(6px,1vh,14px);background:var(--orange);z-index:1}
body[data-palette="red"] .band{background:var(--orange)}
.bottom{display:flex;align-items:flex-end;justify-content:space-between;gap:calc(3*var(--u))}

.screen.a .clockwrap,.screen.a .msg{display:none}
.screen.b .title,.screen.b .subtitle,.screen.b .meta{display:none}
.stage[data-layout="mirror"] .screen .clockwrap,.stage[data-layout="single"] .screen .clockwrap{display:block}
.stage[data-layout="mirror"] .screen .title,.stage[data-layout="mirror"] .screen .subtitle,
.stage[data-layout="mirror"] .screen .meta{display:block}
.stage[data-layout="single"] .screen.a .msg{display:block}
.stage[data-layout="mirror"] .clockwrap .clock{font-size:clamp(40px,calc(6*var(--u)),170px)}
.stage[data-layout="mirror"] .msg{display:none}
.stage[data-layout="single"] .row{display:flex;justify-content:space-between;align-items:flex-end;gap:calc(4*var(--u));flex-wrap:wrap}
.row{display:block}

/* QR code to the Livro de Resumos */
.qr{flex:none;display:flex;flex-direction:column;align-items:center;gap:clamp(8px,1.4vh,18px);background:#FFFFFF;border-radius:clamp(12px,1.6vh,24px);padding:clamp(12px,2vh,30px);box-shadow:0 10px 30px -12px rgba(94,20,24,.45)}
.qr img{display:block;width:clamp(120px,26vh,420px);height:auto;aspect-ratio:1}
.qr span{font-weight:700;color:#13305E;font-size:clamp(13px,calc(1.05*var(--u)),28px);line-height:1.2;text-align:center;max-width:14ch}
.qr small{display:block;font-weight:500;color:#9E2229;font-size:.78em;margin-top:.2em}
.screen.a .row{display:flex;justify-content:space-between;align-items:flex-end;gap:calc(3*var(--u))}
.screen.a .qr{display:flex}
/* left projector: QR sits bottom-right, beside the title block */
.stage[data-layout="split"] .screen.a .qr{position:absolute;right:clamp(24px,calc(5*var(--u)),120px);bottom:clamp(24px,6vh,90px)}
.stage[data-layout="split"] .screen.a .title{font-size:clamp(30px,calc(3.6*var(--u)),140px)}
body.no-qr .qr{display:none!important}
.stage[data-layout="single"] .row .qr{margin-left:auto}

/* swapping sides: fade out, swap, fade in */
.screen{transition:opacity 1s ease}
.stage.fading .screen{opacity:0}
.stage.swapped[data-view="0"] .screen.a{order:2}
@media (prefers-reduced-motion:reduce){.screen{transition:none}}

/* anthem lyrics (texts come from hinos.js) */
.hino{position:fixed;inset:0;z-index:40;display:none;grid-template-columns:1fr}
body.hino-on .hino{display:grid}
body.hino-on .stage{visibility:hidden}
#bg{transition:opacity .6s ease}
body.hino-on #bg{opacity:.25}
:root:not(.view-1):not(.view-2) .hino.dual{grid-template-columns:1fr 1fr}
.hino .blk{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:clamp(8px,2.6vh,36px);padding:clamp(20px,4vh,70px) clamp(20px,calc(2.2*var(--u)),70px);min-width:0;min-height:0;overflow:hidden}
.hino .blk+.blk{display:none}
:root:not(.view-1):not(.view-2) .hino.dual .blk+.blk{display:flex}
.hino .h-head{display:flex;flex-direction:column;align-items:center;gap:.25em}
.hino .h-titulo{color:var(--accent);font-weight:700;font-size:clamp(16px,calc(1.6*var(--u)),48px);line-height:1.1;letter-spacing:-.02em}
.hino .h-sub{color:var(--muted);font-weight:500;font-size:clamp(12px,calc(1.1*var(--u)),30px)}
.hino .h-label{color:#fff;background:var(--accent);border-radius:999px;padding:.35em 1.1em;font-weight:700;text-transform:uppercase;letter-spacing:.14em;font-size:clamp(12px,calc(1.2*var(--u)),34px)}
.hino .h-label{display:none}
.hino .h-versos{color:var(--text);font-weight:700;line-height:1.22;letter-spacing:-.01em;font-size:clamp(20px,calc(4.2*var(--u)),150px);transition:opacity .35s ease;max-width:100%}
.hino .h-versos{display:grid;justify-content:center;gap:.45em}
.hino .h-est{display:flex;flex-direction:column;justify-content:center;padding:.3em .75em;border-radius:.3em;background:rgba(0,0,0,.06);background:color-mix(in srgb,var(--text) 7%,transparent)}
.hino .h-est.refrao{background:rgba(179,32,30,.1);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.hino .h-versos p{margin:0;white-space:nowrap}
.hino .h-versos.out{opacity:0}
.hino .h-aviso{color:var(--muted);font-size:clamp(14px,calc(1.4*var(--u)),36px);white-space:normal;max-width:30em;font-weight:500}
.hino .h-dots{display:flex;gap:clamp(6px,.8vh,12px)}
.hino .h-dots i{width:clamp(8px,1vh,14px);height:clamp(8px,1vh,14px);border-radius:50%;background:var(--line)}
.hino .h-dots i.on{background:var(--accent)}
@media (prefers-reduced-motion:reduce){.hino .h-versos{transition:none}}
.panel .hinobtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}

/* controls */
.gear{position:fixed;right:16px;top:calc(16px + env(safe-area-inset-top,0px));z-index:5;width:44px;height:44px;border-radius:50%;border:1px solid var(--panel-line);background:var(--panel);color:var(--text);font-size:20px;cursor:pointer;opacity:0;transition:opacity .4s}
body:not(.idle) .gear{opacity:.9}
.gear:focus-visible,.panel :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.panel{position:fixed;right:16px;top:calc(70px + env(safe-area-inset-top,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(380px,calc(100% - 32px));z-index:6;background:var(--panel);border:1px solid var(--panel-line);border-radius:14px;padding:20px;overflow:auto;display:none;font-size:14px;color:var(--text)}
.panel.open{display:block}
.panel h2{font-size:18px;margin:0 0 4px}
.panel p.hint{color:var(--muted);margin:0 0 16px;line-height:1.45}
.panel label{display:block;margin:12px 0 4px;font-weight:500}
.panel input,.panel textarea,.panel select{width:100%;font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--panel-line);background:var(--bg);color:var(--text)}
.panel textarea{min-height:110px;resize:vertical}
.panel .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.panel .btns{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.panel button{font:inherit;padding:9px 14px;border-radius:8px;border:1px solid var(--panel-line);background:var(--bg);color:var(--text);cursor:pointer}
.panel button.primary{background:var(--accent);color:var(--bg);border-color:var(--accent);font-weight:700}
kbd{font-family:inherit;border:1px solid var(--panel-line);border-radius:4px;padding:0 5px}

@media (max-width:700px){
  .stage{grid-template-columns:1fr;grid-template-rows:1fr 1fr}
}
@media (prefers-reduced-motion:reduce){.msg{transition:none}}
</style>

    <div><label for="f-date">Date</label><input id="f-date" data-k="date"></div>
    <div><label for="f-venue">Venue</label><input id="f-venue" data-k="venue"></div>
  </div>
  <label for="f-messages">Rotating messages (one per line)</label>
  <textarea id="f-messages" data-k="messages"></textarea>
  <label for="f-footer">Footer line (Wi-Fi, hashtag… optional)</label>
  <input id="f-footer" data-k="footer">

  <div class="two">
    <div>
      <label for="f-layout">Layout</label>
      <select id="f-layout" data-k="layout">
        <option value="split">Split across 2 screens</option>
        <option value="mirror">Same on both screens</option>
        <option value="single">Single screen</option>
      </select>
    </div>
    <div>
      <label for="f-palette">Colours</label>
      <select id="f-palette" data-k="palette">
        <option value="ustm">USTM cream</option>
        <option value="white">Pure white</option>
        <option value="red">USTM red</option>
        <option value="orange">USTM orange</option>
      </select>
    </div>
  </div>
  <div class="two">
    <div><label for="f-every">Message every (s)</label><input id="f-every" type="number" min="3" max="120" data-k="every"></div>
    <div><label for="f-h24">Clock</label>
      <select id="f-h24" data-k="h24"><option value="1">24-hour</option><option value="0">12-hour</option></select></div>
  </div>

  <label for="f-qr">QR code (Livro de Resumos)</label>
  <select id="f-qr" data-k="qr"><option value="1">Show</option><option value="0">Hide</option></select>

  <label for="f-swap">Swap left and right screens</label>
  <select id="f-swap" data-k="swap">
    <option value="0">Off</option>
    <option value="60">Every 1 minute</option>
    <option value="120">Every 2 minutes</option>
    <option value="300">Every 5 minutes</option>
  </select>

  <label>Anthems (lyrics from hinos.js)</label>
  <div class="hinobtns" id="hinobtns"></div>
  <p class="hint" id="hinohint" style="margin:.4em 0 0;font-size:.85em;opacity:.8"></p>

  <label for="f-view">This window shows</label>
  <select id="f-view">
    <option value="0">Both screens (one wide window)</option>
    <option value="1">Left screen only (projector 1)</option>
    <option value="2">Right screen only (projector 2)</option>
  </select>
  <div class="btns">
    <button class="primary" id="fs">Go full screen</button>
    <button id="reset">Reset to defaults</button>
    <button id="close">Close</button>
  </div>
</aside>

<script src="hinos.js"></script>
<script>
(function(){
const DEFAULTS={
  title:"III Conferência Nacional\nDom Alexandre\nMaria dos Santos",
  subtitle:"& Jornadas Científicas",
  date:"Setembro de 2026",
  venue:"Maputo, Moçambique",
  messages:"Bem-vindos à conferência\nA sessão terá início em breve\nPor favor, coloque o telemóvel em silêncio\nUniversidade São Tomás de Moçambique",
  footer:"",
  layout:"split", palette:"orange", every:"8", h24:"1", qr:"1", swap:"120"
};
let cfg=Object.assign({},DEFAULTS);
try{const s=localStorage.getItem("confsaver-ustm-3cn3-laranja-alterna");if(s)cfg=Object.assign(cfg,JSON.parse(s));}catch(e){}
function save(){try{localStorage.setItem("confsaver-ustm-3cn3-laranja-alterna",JSON.stringify(cfg));}catch(e){}}

const stage=document.getElementById("stage"),panel=document.getElementById("panel"),gear=document.getElementById("gear");
const msgEls=[...document.querySelectorAll("[data-msg]")];
let msgs=[],mi=0,timer=null;

function apply(){
  document.querySelectorAll("[data-f]").forEach(el=>el.textContent=cfg[el.dataset.f]||"");
  stage.dataset.layout=cfg.layout;
  document.body.dataset.palette=cfg.palette;
  document.body.classList.toggle("no-qr",cfg.qr==="0");
  document.title=cfg.title||"Conference Screensaver";
  msgs=(cfg.messages||"").split("\n").map(s=>s.trim()).filter(Boolean);
  mi=0; showMsg(true); restartTimer(); readColors(); fitTitle();
}
// shrink the title only if a line would overflow its screen (e.g. offline fallback font)
function fitTitle(){document.querySelectorAll(".title").forEach(t=>{t.style.fontSize="";
  if(!t.offsetParent)return; const box=t.parentElement.clientWidth; if(t.scrollWidth>box){
  t.style.fontSize=(parseFloat(getComputedStyle(t).fontSize)*box/t.scrollWidth*0.98)+"px";}});}
addEventListener("resize",()=>fitTitle());
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>fitTitle());
function showMsg(instant){
  const t=msgs.length?msgs[mi%msgs.length]:"";
  if(instant){msgEls.forEach(e=>{e.textContent=t;e.classList.remove("out")});return;}
  msgEls.forEach(e=>e.classList.add("out"));
  setTimeout(()=>msgEls.forEach(e=>{e.textContent=t;e.classList.remove("out")}),900);
}
// messages follow the wall clock, so two windows on two projectors stay in step
function slot(){return Math.floor(Date.now()/(Math.max(3,+cfg.every||8)*1000));}
function next(){if(msgs.length>1){mi=(mi+1)%msgs.length;showMsg(false);}}
function restartTimer(){clearInterval(timer);let cur=slot();mi=cur%Math.max(1,msgs.length);showMsg(true);
  timer=setInterval(()=>{const n=slot();if(n!==cur){cur=n;next();}},500);}

// form
document.querySelectorAll("[data-k]").forEach(el=>{
  el.value=cfg[el.dataset.k];
  el.addEventListener("input",()=>{cfg[el.dataset.k]=el.value;save();apply();});
});
function togglePanel(open){
  const o=open===undefined?!panel.classList.contains("open"):open;
  panel.classList.toggle("open",o);gear.setAttribute("aria-expanded",o);
}
gear.onclick=()=>togglePanel();
document.getElementById("close").onclick=()=>togglePanel(false);
document.getElementById("reset").onclick=()=>{cfg=Object.assign({},DEFAULTS);save();
  document.querySelectorAll("[data-k]").forEach(el=>el.value=cfg[el.dataset.k]);apply();};
function fullscreen(){
  const d=document;
  if(!d.fullscreenElement){(d.documentElement.requestFullscreen||d.documentElement.webkitRequestFullscreen||function(){}).call(d.documentElement);}
  else{(d.exitFullscreen||d.webkitExitFullscreen).call(d);}
}
document.getElementById("fs").onclick=()=>{togglePanel(false);fullscreen();};
addEventListener("keydown",e=>{
  if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;
  if(hinoKey(e))return;
  if(e.key==="f"||e.key==="F")fullscreen();
  else if(e.key==="s"||e.key==="S")togglePanel();
  else if(e.key===" "){e.preventDefault();next();}
  else if(e.key==="1"||e.key==="2"||e.key==="0"){setView(e.key);}
  else if(e.key==="Escape")togglePanel(false);
});

// which screen this window shows
const viewSel=document.getElementById("f-view");let view="0";
let swapped=false,swapPending=false;
function effView(){return (swapped&&view!=="0")?(view==="1"?"2":"1"):view;}
function renderView(){stage.dataset.view=effView();stage.classList.toggle("swapped",swapped);fitTitle();}
function swapState(){const p=+cfg.swap||0;if(!p||cfg.layout!=="split")return false;
  return Math.floor(Date.now()/(p*1000))%2===1;} // wall clock, so both projectors swap together
function checkSwap(){const st=swapState();if(st===swapped||swapPending)return;
  if(matchMedia("(prefers-reduced-motion: reduce)").matches){swapped=st;renderView();return;}
  swapPending=true;stage.classList.add("fading");
  setTimeout(()=>{swapped=st;renderView();
    requestAnimationFrame(()=>requestAnimationFrame(()=>{stage.classList.remove("fading");swapPending=false;}));},1000);}
function setView(v){view=v;viewSel.value=v;
  document.documentElement.classList.remove("view-1","view-2");if(v!=="0")document.documentElement.classList.add("view-"+v);
  try{history.replaceState(null,"",v==="0"?location.pathname+location.search:"#"+v);}catch(e){}
  renderView();}
viewSel.onchange=()=>setView(viewSel.value);
setView((location.hash.match(/^#([12])$/)||[,"0"])[1]);

// hide cursor when idle
let idleT;function wake(){document.body.classList.remove("idle");clearTimeout(idleT);
  idleT=setTimeout(()=>{if(!panel.classList.contains("open"))document.body.classList.add("idle")},2500);}
["mousemove","mousedown","touchstart","keydown"].forEach(ev=>addEventListener(ev,wake,{passive:true}));wake();

// clock
const clk=document.querySelector("[data-clock]"),sec=document.querySelector("[data-sec]"),day=document.querySelector("[data-day]");
function tick(){
  const d=new Date();let h=d.getHours();const h24=cfg.h24==="1";
  if(!h24){h=h%12||12;}
  const m=String(d.getMinutes()).padStart(2,"0");
  clk.textContent=(h24?String(h).padStart(2,"0"):h)+":"+m;
  sec.textContent=h24?String(d.getSeconds()).padStart(2,"0"):(d.getHours()<12?"AM":"PM");
  day.textContent=d.toLocaleDateString("pt-PT",{weekday:"long",day:"numeric",month:"long"});
}
tick();setInterval(tick,1000);

// slow drift to protect projectors/panels from burn-in
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
function drift(t){const s=t/1000;
  stage.style.transform=`translate(${Math.sin(s/97)*14}px,${Math.cos(s/131)*10}px)`;
  requestAnimationFrame(drift);}
if(!reduce)requestAnimationFrame(drift);

// ---- background: drifting contour lines spanning the full width ----
const cv=document.getElementById("bg"),ctx=cv.getContext("2d");
let W,H,DPR,lineColor="#F6A866",accentColor="#B3201E";
function readColors(){const cs=getComputedStyle(document.body);
  lineColor=cs.getPropertyValue("--line").trim();accentColor=cs.getPropertyValue((document.body.dataset.palette==="red"||document.body.dataset.palette==="orange")?"--orange":"--accent").trim();}
function resize(){DPR=Math.min(devicePixelRatio||1,1.5);W=innerWidth;H=innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
addEventListener("resize",resize);resize();

// 3D gradient noise
let seed=20260928;const rnd=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;};
const P=new Uint8Array(512);{const p=[...Array(256).keys()];for(let i=255;i>0;i--){const j=(rnd()*(i+1))|0;[p[i],p[j]]=[p[j],p[i]];}for(let i=0;i<512;i++)P[i]=p[i&255];}
const fade=t=>t*t*t*(t*(t*6-15)+10),lerp=(a,b,t)=>a+t*(b-a);
function grad(h,x,y,z){h&=15;const u=h<8?x:y,v=h<4?y:(h===12||h===14?x:z);return((h&1)?-u:u)+((h&2)?-v:v);}
function noise(x,y,z){const X=Math.floor(x)&255,Y=Math.floor(y)&255,Z=Math.floor(z)&255;
  x-=Math.floor(x);y-=Math.floor(y);z-=Math.floor(z);const u=fade(x),v=fade(y),w=fade(z);
  const A=P[X]+Y,AA=P[A]+Z,AB=P[A+1]+Z,B=P[X+1]+Y,BA=P[B]+Z,BB=P[B+1]+Z;
  return lerp(lerp(lerp(grad(P[AA],x,y,z),grad(P[BA],x-1,y,z),u),lerp(grad(P[AB],x,y-1,z),grad(P[BB],x-1,y-1,z),u),v),
    lerp(lerp(grad(P[AA+1],x,y,z-1),grad(P[BA+1],x-1,y,z-1),u),lerp(grad(P[AB+1],x,y-1,z-1),grad(P[BB+1],x-1,y-1,z-1),u),v),w);}

const LEVELS=11;let last=0;
function draw(t){
  requestAnimationFrame(draw);
  if(t-last<40)return; last=t; // ~25fps is plenty and keeps laptops cool
  const cell=Math.max(18,Math.round(Math.min(W,H)/40));
  const cols=Math.ceil(W/cell)+1,rows=Math.ceil(H/cell)+1;
  const z=reduce?0:(Date.now()%1e9)*0.000035,sc=1/ (cell*14);
  const ox=view==="2"?W:0; // right projector continues the left one
  const f=new Float32Array(cols*rows);
  for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){
    const x=i*cell+ox,y=j*cell;
    f[j*cols+i]=noise(x*sc,y*sc*1.15,z)+0.5*noise(x*sc*2.1,y*sc*2.1,z*1.7+9);
  }
  ctx.clearRect(0,0,W,H);ctx.lineWidth=1.1;
  for(let l=0;l<LEVELS;l++){
    const iso=-0.75+l*(1.5/(LEVELS-1));
    const hi=l===Math.floor(LEVELS/2);
    ctx.strokeStyle=hi?accentColor:lineColor;ctx.globalAlpha=hi?0.45:0.75;ctx.lineWidth=hi?2:1.6;
    ctx.beginPath();
    for(let j=0;j<rows-1;j++)for(let i=0;i<cols-1;i++){
      const a=f[j*cols+i],b=f[j*cols+i+1],c=f[(j+1)*cols+i+1],d=f[(j+1)*cols+i];
      const k=(a>iso?8:0)|(b>iso?4:0)|(c>iso?2:0)|(d>iso?1:0);
      if(k===0||k===15)continue;
      const x=i*cell,y=j*cell;
      const T=[x+cell*(iso-a)/(b-a),y],R=[x+cell,y+cell*(iso-b)/(c-b)],
            Bt=[x+cell*(iso-d)/(c-d),y+cell],L=[x,y+cell*(iso-a)/(d-a)];
      const seg=(p,q)=>{ctx.moveTo(p[0],p[1]);ctx.lineTo(q[0],q[1]);};
      switch(k){case 1:case 14:seg(L,Bt);break;case 2:case 13:seg(Bt,R);break;case 3:case 12:seg(L,R);break;
        case 4:case 11:seg(T,R);break;case 5:seg(L,T);seg(Bt,R);break;case 6:case 9:seg(T,Bt);break;
        case 7:case 8:seg(L,T);break;case 10:seg(L,Bt);seg(T,R);break;}
    }
    ctx.stroke();
  }
  ctx.globalAlpha=1;
}

// ---- anthems: lyrics are read from hinos.js, one stanza at a time ----
const HINOS=(Array.isArray(window.HINOS)?window.HINOS:[]).map(parseHino);
function norm(t){return String(t||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]/g,"");}
function parseHino(h){
  const raw=String(h.letra||"").replace(/\r/g,"");
  const falta=!raw.trim()||/COLE AQUI/i.test(raw);
  const est=[];let cur=null;
  const close=()=>{if(cur&&cur.lines.length)est.push(cur);cur=null;};
  for(let line of raw.split("\n")){
    line=line.trim();
    if(!line){if(cur&&cur.lines.length)close();continue;}
    if(norm(line)===norm(h.titulo))continue;
    let m=line.match(/^refr[aã]o\s*(?:[:.\-–]\s*(.*)|$)/i);
    if(m){close();cur={label:"Refrão",refrao:true,lines:[]};if(m[1])cur.lines.push(m[1]);continue;}
    m=line.match(/^(\d{1,2})\s*(?:[°ºª]|\.|\)|-|–)\s*(.*)$/)||line.match(/^(\d{1,2})\s+(estrofe.*)$/i);
    if(m){let rest=m[2];
      if(/^estrofe\s*[:.\-–]?\s*$/i.test(rest))rest="";           // "1° Estrofe:" on its own line
      else rest=rest.replace(/^estrofe\s*[:.\-–]\s*/i,"");         // "1° Estrofe: first line"
      close();cur={label:m[1]+".ª estrofe",lines:[]};if(rest)cur.lines.push(rest);continue;}
    if(!cur)cur={label:"",lines:[]};
    cur.lines.push(line);
  }
  close();
  // split long blocks (e.g. text pasted without blank lines) into screens of N lines
  const per=Math.max(2,+h.versosPorEcra||4);
  let est2=[];
  est.forEach(x=>{ if(x.lines.length<=per+1){est2.push(x);return;}
    for(let i=0;i<x.lines.length;i+=per)est2.push({label:i===0?x.label:"",refrao:x.refrao,lines:x.lines.slice(i,i+per),auto:!x.label||i>0});});
  // a block that appears more than once is the refrain; the others get numbered
  const key=x=>x.lines.join("|").toLowerCase().replace(/[^a-zà-ú0-9|]/g,"");
  const cnt={};est2.forEach(x=>{cnt[key(x)]=(cnt[key(x)]||0)+1;});
  const hasRefrao=est2.some(x=>x.refrao);
  let n=0;est2.forEach(x=>{
    if(x.refrao){x.label="Refrão";return;}
    if(!hasRefrao&&cnt[key(x)]>1){x.label="Refrão";x.refrao=true;return;}
    if(x.label&&!x.auto){const m=x.label.match(/^(\d+)/);if(m)n=+m[1];return;}
    x.label=(++n)+".ª estrofe";});
  const est3=est2;
  let seq=est3;
  const r=est3.find(x=>x.refrao);
  if(h.repetirRefrao&&r){
    seq=[];if(est3[0]===r)seq.push(r);
    est3.filter(x=>!x.refrao).forEach(x=>{seq.push(x);seq.push(r);});
  }
  return {tecla:String(h.tecla||"").toUpperCase(),titulo:h.titulo||"",sub:h.subtitulo||"",est:seq,falta};
}
const hinoEl=document.getElementById("hino");
hinoEl.classList.add("dual");
let hi=-1,hk=0,hinoT=null;
function hinoOpen(i){hi=i;hk=0;document.body.classList.add("hino-on");togglePanel(false);hinoRender(false);}
function hinoClose(){hi=-1;document.body.classList.remove("hino-on");}
function hinoRender(anim){
  const h=HINOS[hi];if(!h)return;
  hinoEl.classList.toggle("dual",document.getElementById("stage").dataset.layout!=="single");
  const fill=()=>{
    hinoEl.querySelectorAll(".blk").forEach(b=>{
      b.querySelector(".h-titulo").textContent=h.titulo;
      b.querySelector(".h-sub").textContent=h.sub;
      const v=b.querySelector(".h-versos"),lab=b.querySelector(".h-label"),dots=b.querySelector(".h-dots");
      v.innerHTML="";v.style.fontSize="";
      if(h.falta||!h.est.length){lab.textContent="";dots.innerHTML="";
        const p=document.createElement("p");p.className="h-aviso";p.textContent="A letra deste hino ainda não foi colada no ficheiro hinos.js.";v.appendChild(p);return;}
      lab.textContent="";dots.innerHTML="";
      // every stanza on one screen, one block each; a stanza repeated right after itself is shown once
      h.est.filter((e,i)=>i===0||e.lines.join("|")!==h.est[i-1].lines.join("|")).forEach(e=>{
        const c=document.createElement("div");c.className="h-est"+(e.refrao?" refrao":"");
        e.lines.forEach(t=>{const p=document.createElement("p");p.textContent=t;c.appendChild(p);});
        v.appendChild(c);});
    });
    hinoFit();
  };
  clearTimeout(hinoT);
  if(anim&&!matchMedia("(prefers-reduced-motion: reduce)").matches){
    hinoEl.querySelectorAll(".h-versos").forEach(v=>v.classList.add("out"));
    hinoT=setTimeout(()=>{fill();hinoEl.querySelectorAll(".h-versos").forEach(v=>v.classList.remove("out"));},350);
  } else fill();
}
function hinoFit(){ // arrange the stanza blocks in the column count that gives the largest text
  hinoEl.querySelectorAll(".blk").forEach(b=>{
    if(!b.offsetParent)return;const v=b.querySelector(".h-versos");
    const cards=[...v.querySelectorAll(".h-est")];if(!cards.length)return;
    const padX=parseFloat(getComputedStyle(b).paddingLeft)*2;
    const fits=()=>v.scrollWidth<=b.clientWidth-padX+1&&b.scrollHeight<=b.clientHeight+1;
    const layout=cols=>{v.style.gridTemplateColumns="repeat("+cols+",max-content)";
      cards.forEach((c,i)=>{const alone=cols>1&&i===cards.length-1&&cards.length%cols===1; // a lone last block is centred
        c.style.gridColumn=alone?"1 / -1":"";c.style.justifySelf=alone?"center":"";});};
    const size=()=>{let lo=10,hi=Math.max(40,b.clientHeight*0.16);
      for(let i=0;i<14;i++){const mid=(lo+hi)/2;v.style.fontSize=mid+"px";if(fits())lo=mid;else hi=mid;}return lo;};
    let best=1,bestSize=0;
    for(let cols=1;cols<=Math.min(cards.length,4);cols++){layout(cols);const s=size();if(s>bestSize+.5){best=cols;bestSize=s;}}
    layout(best);v.style.fontSize=bestSize+"px";
  });
}
addEventListener("resize",()=>{if(hi>=0)hinoFit();});
function hinoKey(e){
  const k=e.key.toUpperCase();
  const j=HINOS.findIndex(h=>h.tecla&&h.tecla===k);
  if(j>=0){ if(hi===j)hinoClose(); else hinoOpen(j); return true; }
  if(hi<0)return false;
  if(["ArrowRight","ArrowDown","PageDown"," ","Enter","ArrowLeft","ArrowUp","PageUp","Backspace","Home"].includes(e.key)){e.preventDefault();return true;}
  if(e.key==="Escape"){hinoClose();return true;}
  return false;
}
(function(){
  const box=document.getElementById("hinobtns"),hint=document.getElementById("hinohint");
  if(!HINOS.length){hint.textContent="hinos.js not found next to this file.";return;}
  HINOS.forEach((h,i)=>{const b=document.createElement("button");b.textContent=h.titulo+(h.tecla?" ("+h.tecla+")":"");b.onclick=()=>hinoOpen(i);box.appendChild(b);});
  hint.textContent="All stanzas are shown on one screen. Exit: Esc or the same key again.";
})();

swapped=swapState();apply();renderView();setInterval(checkSwap,500);requestAnimationFrame(draw);
})();
</script>
</body>
</html>
